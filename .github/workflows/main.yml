on:
  push:
    branches:
    - main
    - overleaf
  workflow_dispatch:
    
jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: GitHub Action for LaTeX
      uses: xu-cheng/latex-action@4.0.0
      with:
        root_file: Final-Project-main.tex
        texlive_version: latest
        os: debian
        extra_system_packages: "inkscape ghostscript"
        latexmk_shell_escape: true
        continue_on_error: true
        pre_compile: "tlmgr update --self && tlmgr update --all"
        args: -pdf -f -lualatex -verbose -bibtex -file-line-error -interaction=nonstopmode
    - name: Upload compile artifacts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: Artifacts
        path: |
          Final-Project-main.pdf
          Final-Project-main.log
        
